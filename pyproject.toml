[project]
name = "gamdo-agent"
version = "0.1.0"
description = "GAMDO - AI 사진 감각 코칭 에이전트 서버 (Claude Code CLI 기반)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "anthropic>=0.52.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "mediapipe>=0.10.0,<1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx",
]
firebase = [
    "firebase-admin>=6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
# 테스트가 루트의 모듈(image_processor 등)을 바로 import한다.
# `pytest`로 실행하면 rootdir이 sys.path에 들어가지 않아 수집 단계에서 실패한다.
pythonpath = ["."]
testpaths = ["tests"]
